<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";</script>
        <script src="font-size.js"></script>
        <title>Recipe Index | Claude's Cookbook</title>
        <link rel="stylesheet" href="recipestyle.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap">
        <link rel="icon" type="image/png" href="/favicon.png">

    </head>

    <body>
        <header>
            <nav class="nav-menu" aria-label="Main navigation">
                <a href="index.html" class="nav-header">
                    <strong>Claude's Cookbook</strong>
                </a>
                <ul class="nav-ul-right">
                    <li><a href="index.html">Recipes</a></li>
                    <li><a href="recipe-index.html" aria-current="page">Recipe Index</a></li>
                    <li><a href="cooking-tips.html">Cooking Tips</a></li>
                    <li><a href="favorites.html">Favorite Recipes (External)</a></li>
                    <li><a href="about.html">About</a></li>
                    <li class="font-size-controls" aria-label="Text size">
                        <button id="decrease-font-size" type="button" aria-label="Decrease text size">A−</button>
                        <button id="increase-font-size" type="button" aria-label="Increase text size">A+</button>
                    </li>
                </ul>
            </nav>
        </header>

        <main class="recipe-index">
            <h1>Recipe Index</h1>

            <input
                type="search"
                id="recipe-search"
                class="recipe-search"
                placeholder="Search recipes..."
                aria-label="Search recipes"
            >

            <ul id="recipe-list" class="recipe-index-list"></ul>

            <p id="no-results">No recipes found.</p>
        </main>

        <script>
            const recipeList = document.getElementById("recipe-list");
            const searchInput = document.getElementById("recipe-search");
            const noResults = document.getElementById("no-results");

            let recipes = [];
            let favoriteRecipes = [];


            fetch("index.html")
                .then(response => response.text())
                .then(html => {
                    const documentParser = new DOMParser();
                    const recipeDocument = documentParser.parseFromString(
                        html,
                        "text/html"
                    );

                    recipes = Array.from(
                        recipeDocument.querySelectorAll(".recipe-item")
                    ).map((recipe, index) => ({
                        name: recipe.querySelector("h2")?.textContent.trim(),
                        id: index
                    })).filter(recipe => recipe.name);

                    recipes.sort((a, b) =>
                        a.name.localeCompare(b.name)
                    );
                    favoriteRecipes = JSON.parse(
                        localStorage.getItem("claudesCookbookFavorites") || "[]"
                    ).map(recipe => ({
                        name: recipe.title,
                        id: recipe.id,
                        isFavorite: true
                    }));

                    const userRecipes = JSON.parse(
                        localStorage.getItem("claudesCookbookUserRecipes") || "[]"
                    ).map(recipe => ({
                        name: recipe.name,
                        id: recipe.id,
                        isUserRecipe: true
                    })).filter(recipe => recipe.name && recipe.id);

                    recipes = recipes.concat(favoriteRecipes, userRecipes);

                    recipes.sort((a, b) => a.name.localeCompare(b.name));
                    displayRecipes(recipes);
                })
                .catch(error => {
                    console.error("Could not load recipes:", error);
                    noResults.textContent = "Unable to load recipes.";
                    noResults.style.display = "block";
                });

            function displayRecipes(recipeArray) {
                recipeList.innerHTML = "";

                recipeArray.forEach(recipe => {
                    const listItem = document.createElement("li");
                    const link = document.createElement("a");

                    link.textContent = recipe.name;
                    link.href = recipe.isFavorite
                        ? `favorites.html#favorite-${recipe.id}`
                        : recipe.isUserRecipe
                            ? `index.html#user-recipe-${encodeURIComponent(recipe.id)}`
                            : `index.html?recipe=${recipe.id}#recipes`;
                    listItem.appendChild(link);
                    recipeList.appendChild(listItem);
                });

                noResults.style.display =
                    recipeArray.length === 0 ? "block" : "none";
            }

            searchInput.addEventListener("input", () => {
                const searchTerm = searchInput.value
                    .trim()
                    .toLowerCase();

                const filteredRecipes = recipes.filter(recipe =>
                    recipe.name.toLowerCase().includes(searchTerm)
                );

                displayRecipes(filteredRecipes);
            });
        </script>
    <footer>
        <p>&copy; 2026 Claude's Cookbook. All rights reserved.</p>
    </footer>
    </body>
</html>
